# ==============================================================================
# MIDI Mobile Manipulator Demo Configuration
# Mode 1: Logitech F710 Gamepad Base Drive (Arm Stowed)
# Mode 2: Arm Teleoperation (Case 1: Leader Arm Mirroring | Case 2: Gamepad Rate Control)
# ==============================================================================

# Active Demo Case:
# 1 = Base Drive + SO-100 Leader Arm Teleoperation (Local on Pi)
# 2 = Base Drive + Logitech Gamepad Arm Teleoperation (All-in-One Gamepad)
# 3 = Remote Network Teleoperation (Leader Arm on PC -> Pi Robot Server)
# null = Interactive menu at startup
case: null

# Case 3 Network Teleoperation Server
network:
  port: 8765
  watchdog_timeout_s: 0.50

# RS485 Serial Bus for DDSM Hub Motors
serial:
  port: "/dev/serial/by-id/usb-FTDI_FT232R_USB_UART_BH002HMM-if00-port0"
  fallback_port: "/dev/ttyUSB0"
  baudrate: 115200
  timeout: 0.02

# DDSM Motors Configuration
motors:
  type: "ddsm115"               # ddsm115 or ddsm210
  left_id: 1                    # RS485 ID of Left Motor
  right_id: 2                   # RS485 ID of Right Motor
  invert_left: false            # Invert direction if mounted mirrored
  invert_right: true

# Mobile Base Dynamics & Kinematics
robot:
  turn_ratio: 0.65              # Pivot turn speed ratio
  turn_dir: -1                  # Turn direction multiplier (-1 = Left stick left -> turn CCW/Left)
  accel_rate: 1500.0            # Acceleration in RPM/s (smooth takeoff)
  decel_rate: 1000.0            # Deceleration in RPM/s on releasing stick
  brake_rate: 3000.0            # Emergency brake rate in RPM/s
  wheel_radius: 0.0575          # meters (115mm diameter / 2)
  wheel_base: 0.350             # meters (track width)

# Logitech F710 Wireless Gamepad (evdev)
gamepad:
  device_path: null             # null = auto-detect (/dev/input/by-id/*F710*)
  deadzone: 0.10                # Analog stick center deadzone
  speed_levels: [50.0, 100.0, 150.0, 200.0]  # RPM levels (LB = speed up, RB = speed down)
  default_speed_level: 1        # Starting index (Level 2 = 100 RPM)
  switch_button: "Y"            # Button to toggle modes ("Y", "X", "A", "BACK")

# SO-100 Robotic Arms (LeRobot)
arm:
  # Follower arm mounted on the mobile chassis
  follower_port: "/dev/serial/by-id/usb-1a86_USB_Single_Serial_5AE6084008-if00"
  follower_fallback_port: "/dev/ttyACM0"
  follower_id: "so100_follower"

  # Leader arm used by people for teleoperation
  leader_port: "/dev/serial/by-id/usb-1a86_USB_Single_Serial_5AE6084621-if00"
  leader_fallback_port: "/dev/ttyACM1"
  leader_id: "so100_leader"

  use_degrees: true             # Joint positions in degrees
  invert_shoulder_pan: false    # Do not alter robot arm rotation (standard 1:1)
  invert_wrist_roll: false
  interpolation_time_s: 1.5     # Seconds for smooth S-curve stow / sync transitions

  # Safe resting / stowed travel pose when driving the mobile base
  stow_pose:
    shoulder_pan.pos: 0.0
    shoulder_lift.pos: -95.0
    elbow_flex.pos: 25.0
    wrist_flex.pos: 95.0
    wrist_roll.pos: 0.0
    gripper.pos: 5.0

# Gamepad Arm Teleoperation (Case 2) Speeds & Rate Limits
arm_gamepad_teleop:
  pan_speed_dps: 50.0           # Shoulder pan speed (deg/s)
  lift_speed_dps: 45.0          # Shoulder lift speed (deg/s)
  elbow_speed_dps: 50.0         # Elbow flex speed (deg/s)
  flex_speed_dps: 45.0          # Wrist flex speed (deg/s)
  roll_speed_dps: 60.0          # Wrist roll speed (deg/s)
  gripper_speed_pct_s: 60.0     # Gripper speed (%/s)

# Control Loop Timing
control:
  loop_hz: 50.0                 # Control loop frequency (50 Hz = 20ms)
  telemetry_interval: 0.20      # Dashboard print interval in seconds

# ==============================================================================
# Case 4: Vision-Guided Autonomous Sock Collection & Basket Tidy
# Suggestion 3 (Wrist Cam Vision + Visual Servoing) & Suggestion 2 (Grip Check)
# ==============================================================================
case4:
  camera:
    device: "/dev/video0"
    fallback: 0
    width: 640
    height: 480
    fps: 30

  # Observation / Scan Pose: Wrist camera looks down at floor in front of base
  scan_pose:
    shoulder_pan.pos: 0.0
    shoulder_lift.pos: -50.0
    elbow_flex.pos: 35.0
    wrist_flex.pos: 70.0
    wrist_roll.pos: 0.0
    gripper.pos: 10.0

  # Multi-angle floor search sweep (shoulder_pan angles in degrees)
  scan_sweep_angles: [0.0, -28.0, 28.0]

  # Floor Grasp Pose: Calibrated downward reach to pick sock from floor below the base
  floor_grasp_pose:
    shoulder_pan.pos: 0.0
    shoulder_lift.pos: -30.0
    elbow_flex.pos: 45.0
    wrist_flex.pos: 80.0
    wrist_roll.pos: 0.0
    gripper.pos: 0.0
  # Basket Pose: Chassis-mounted collection basket on the mobile base
  # Located directly behind the gripper centerline and elevated
  basket_pose:
    shoulder_pan.pos: 0.0
    shoulder_lift.pos: -80.0
    elbow_flex.pos: 20.0
    wrist_flex.pos: 50.0
    wrist_roll.pos: 0.0
    gripper.pos: 85.0
  # Suggestion 2: Tactile / Position grasp verification threshold (%)
  # Checked while elevated: empty jaws close < 8%; trapped cloth holds jaws >= 12%
  grasp_verification_threshold_pct: 12.0

  # Vision Detection Settings
  detection:
    mode: "auto"                # "auto", "contrast", or "color"
    min_area: 1000.0            # minimum contour area (pixels)
    max_area: 80000.0           # maximum contour area (pixels)
    contrast_threshold: 38.0    # threshold against median floor background
    border_margin: 12           # pixels from ROI edge to reject border vignetting
    save_debug_image: true      # save annotated frame for live operator inspection
    debug_image_path: "/tmp/sock_detection.jpg"

  # Visual Servoing Gains
  servoing:
    pan_gain: 22.0              # max pan angle correction in degrees
    lift_gain: 15.0             # max lift angle correction in degrees
    align_tolerance: 0.12       # normalized centering threshold [-1.0, 1.0]
