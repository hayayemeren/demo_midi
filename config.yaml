# ==============================================================================
# MIDI Mobile Manipulator Demo Configuration
# Mode 1: Logitech F710 Gamepad Base Drive (Arm Stowed)
# Mode 2: Arm Teleoperation (Case 1: Leader Arm Mirroring | Case 2: Gamepad Rate Control)
# ==============================================================================

# Active Demo Case:
# 1 = Base Drive + SO-100 Leader Arm Teleoperation (Local on Pi)
# 2 = Base Drive + Logitech Gamepad Arm Teleoperation (All-in-One Gamepad)
# 3 = Remote Network Teleoperation (Leader Arm on PC -> Pi Robot Server)
# null = Interactive menu at startup
case: null

# Case 3 Network Teleoperation Server
network:
  port: 8765
  watchdog_timeout_s: 0.50

# RS485 Serial Bus for DDSM Hub Motors
serial:
  port: "/dev/serial/by-id/usb-FTDI_FT232R_USB_UART_BH002HMM-if00-port0"
  fallback_port: "/dev/ttyUSB0"
  baudrate: 115200
  timeout: 0.012

# DDSM Motors Configuration
motors:
  type: "ddsm115"               # ddsm115 or ddsm210
  left_id: 2                    # RS485 ID of Left Motor
  right_id: 1                   # RS485 ID of Right Motor
  invert_left: false            # Invert direction if mounted mirrored
  invert_right: true

# Mobile Base Dynamics & Kinematics
robot:
  turn_ratio: 0.65              # Pivot turn speed ratio
  turn_dir: 1                   # Turn direction multiplier
  accel_rate: 1500.0            # Acceleration in RPM/s (smooth takeoff)
  decel_rate: 1000.0            # Deceleration in RPM/s on releasing stick
  brake_rate: 3000.0            # Emergency brake rate in RPM/s
  wheel_radius: 0.0575          # meters (115mm diameter / 2)
  wheel_base: 0.350             # meters (track width)

# Logitech F710 Wireless Gamepad (evdev)
gamepad:
  device_path: null             # null = auto-detect (/dev/input/by-id/*F710*)
  deadzone: 0.10                # Analog stick center deadzone
  speed_levels: [50.0, 100.0, 150.0, 200.0]  # RPM levels (LB = speed up, RB = speed down)
  default_speed_level: 1        # Starting index (Level 2 = 100 RPM)
  switch_button: "Y"            # Button to toggle modes ("Y", "X", "A", "BACK")

# SO-100 Robotic Arms (LeRobot)
arm:
  # Follower arm mounted on the mobile chassis
  follower_port: "/dev/serial/by-id/usb-1a86_USB_Single_Serial_5AE6084008-if00"
  follower_fallback_port: "/dev/ttyACM0"
  follower_id: "so100_follower"

  # Leader arm used by people for teleoperation
  leader_port: "/dev/serial/by-id/usb-1a86_USB_Single_Serial_5AE6084621-if00"
  leader_fallback_port: "/dev/ttyACM1"
  leader_id: "so100_leader"

  use_degrees: true             # Joint positions in degrees
  invert_shoulder_pan: false    # Do not alter robot arm rotation (standard 1:1)
  invert_wrist_roll: false
  interpolation_time_s: 1.5     # Seconds for smooth S-curve stow / sync transitions

  # Safe resting / stowed travel pose when driving the mobile base
  stow_pose:
    shoulder_pan.pos: 0.0
    shoulder_lift.pos: -95.0
    elbow_flex.pos: 25.0
    wrist_flex.pos: 95.0
    wrist_roll.pos: 0.0
    gripper.pos: 5.0

# Gamepad Arm Teleoperation (Case 2) Speeds & Rate Limits
arm_gamepad_teleop:
  pan_speed_dps: 50.0           # Shoulder pan speed (deg/s)
  lift_speed_dps: 45.0          # Shoulder lift speed (deg/s)
  elbow_speed_dps: 50.0         # Elbow flex speed (deg/s)
  flex_speed_dps: 45.0          # Wrist flex speed (deg/s)
  roll_speed_dps: 60.0          # Wrist roll speed (deg/s)
  gripper_speed_pct_s: 60.0     # Gripper speed (%/s)

# Control Loop Timing
control:
  loop_hz: 50.0                 # Control loop frequency (50 Hz = 20ms)
  telemetry_interval: 0.20      # Dashboard print interval in seconds

# ==============================================================================
# Case 4: Vision-Guided Autonomous Sock Collection & Basket Tidy
# Suggestion 3 (Wrist Cam Vision + Visual Servoing) & Suggestion 2 (Grip Check)
# ==============================================================================
case4:
  camera:
    device: "/dev/video0"
    fallback: 0
    width: 640
    height: 480
    fps: 30

  # Observation / Scan Pose: Wrist camera looks down at floor in front of base
  scan_pose:
    shoulder_pan.pos: -7.1
    shoulder_lift.pos: -63.7
    elbow_flex.pos: 17.3
    wrist_flex.pos: 96.0
    wrist_roll.pos: 1.5
    gripper.pos: 5.0

  # 3-Point Calibrated Floor Scan Poses (Middle, Left, Right)
  scan_poses:
    center:
      shoulder_pan.pos: -7.1
      shoulder_lift.pos: -63.7
      elbow_flex.pos: 17.3
      wrist_flex.pos: 96.0
      wrist_roll.pos: 1.5
      gripper.pos: 5.0
    left:
      shoulder_pan.pos: -67.3
      shoulder_lift.pos: -68.9
      elbow_flex.pos: 17.3
      wrist_flex.pos: 96.0
      wrist_roll.pos: 1.5
      gripper.pos: 5.0
    right:
      shoulder_pan.pos: 65.1
      shoulder_lift.pos: -68.9
      elbow_flex.pos: 17.3
      wrist_flex.pos: 96.0
      wrist_roll.pos: 1.5
      gripper.pos: 5.0

  # Multi-angle floor search sweep (shoulder_pan angles in degrees fallback)
  scan_sweep_angles: [0.0, -28.0, 28.0]

  # Floor Grasp Pose: Calibrated downward reach to touch floor perpendicularly below the base
  floor_grasp_pose:
    shoulder_pan.pos: -4.4
    shoulder_lift.pos: 97.5
    elbow_flex.pos: -58.2
    wrist_flex.pos: 59.6
    wrist_roll.pos: -0.7
    gripper.pos: 0.0

  # SO-100 Analytical Inverse Kinematics (IK) Pick Engine
  kinematics:
    enabled: true               # Enable closed-form SO-100/SO-101 URDF Inverse Kinematics for picking
    l1_m: 0.1160                # Upper arm length: shoulder pitch axis to elbow pitch axis (meters)
    l2_m: 0.1350                # Forearm length: elbow pitch axis to wrist pitch axis (meters)
    l3_m: 0.1594                # Effective gripper length: wrist pitch axis to fingertips (meters)
    ground_clearance_m: 0.024   # Safe elevation above raw floor contact (24mm -> ~20mm actual clearance with servo droop)
    hover_height_m: 0.115       # Pre-grasp hover height above floor (115mm) for clean close-up framing
    lift_height_m: 0.125        # Post-grasp vertical lift height above floor (125mm)
    radial_gain_m: 0.050        # Legacy fallback distance gain (meters)
    pan_gain_deg: 60.0          # Azimuthal pan compensation across camera horizontal FOV (degrees)
    r_near_m: 0.145             # Minimum floor reach from shoulder_pan axis (clears front aluminum bumper)
    r_far_m: 0.315              # Maximum floor reach from shoulder_pan axis along floor (meters)
    y_near_px: 330.0            # Fallback pixel Y for near floor edge
    y_far_px: 60.0              # Fallback pixel Y for far floor edge
    sock_height_offset_m: 0.015 # Target sock surface elevation above bare floor for ray-plane projection (meters)
    cam_offset_gf: [-0.0900, -0.0010, -0.1045] # Calibrated wrist camera offset in gripper_frame_link (meters)
    cam_pitch_deg: -33.01       # Calibrated wrist camera pitch tilt relative to gripper axis (degrees)
    cam_fx: 531.5               # Calibrated wrist camera focal length (pixels)

  # Basket Pose: Chassis-mounted collection basket on the mobile base
  # Located directly behind the gripper centerline and elevated
  basket_pose:
    shoulder_pan.pos: -3.3
    shoulder_lift.pos: -36.4
    elbow_flex.pos: -80.4
    wrist_flex.pos: -101.5
    wrist_roll.pos: -179.1
    gripper.pos: 85.0
  # Suggestion 2: Tactile / Position grasp verification threshold (%)
  # Empty jaws close to ~5.2%; trapped cloth holds jaws >= 5.8%
  grasp_verification_threshold_pct: 5.8
  abort_on_miss: false         # If false, always proceeds to basket without dropping on floor

  # Vision Detection Settings
  detection:
    mode: "auto"                # "auto", "contrast", or "color"
    min_area: 800.0             # minimum contour area (pixels) - rejects small floor noise
    max_area: 80000.0           # maximum contour area (pixels)
    contrast_threshold: 35.0    # threshold against median floor background (rejects floor seams diff ~26)
    border_margin: 4            # pixels from ROI edge to reject border vignetting
    roi_top_pct: 0.06           # Active floor ROI top margin
    roi_bottom_pct: 0.74        # Active floor ROI bottom margin
    roi_left_pct: 0.04          # Active floor ROI left margin (expanded for wide sock coverage)
    roi_right_pct: 0.96         # Active floor ROI right margin
    save_debug_image: true      # save annotated frame for live operator inspection
    debug_image_path: "/tmp/sock_detection.jpg"
    debug_raw_path: "/tmp/sock_raw.jpg"
    debug_mask_path: "/tmp/sock_mask.jpg"
    debug_combined_path: "/tmp/sock_combined.jpg"
    enable_web_stream: false    # Web stream disabled to eliminate CPU overhead and latency
    web_stream_port: 8080

  # Visual Servoing Gains
  servoing:
    pan_gain: 60.0              # max pan angle correction across horizontal FOV in degrees
    pan_direction: 1.0          # pan direction multiplier (+1.0: right is positive pan, -1.0: right is negative pan)
    lift_gain: 15.0             # max lift angle correction in degrees
    align_tolerance: 0.12       # normalized centering threshold [-1.0, 1.0]
    reach_elbow_gain: 20.0      # forward/backward reach modulation gain (degrees)
    reach_lift_gain: 6.0        # lift angle compensation with reach (degrees)
    max_reach_delta_deg: 18.0   # clamp maximum reach adjustment (degrees)
    enable_roll_alignment: false # Keep gripper wrist roll fixed to calibrated floor grasp value (no unwanted wrist twist)
    enable_hover_refinement: true # pre-grasp hover at 8-10cm + close-up camera refinement
    hover_lift_offset_deg: -14.0 # elevation offset for pre-grasp hover (degrees)
    max_align_iterations: 3     # closed-loop centering loop maximum iterations

  # Motion Timing (seconds) - Smooth, gentle S-curve transitions
  motion:
    scan_move_duration_s: 1.5   # Camera pan sweep duration
    descend_duration_s: 2.5     # Descent to floor grasp pose
    clamp_duration_s: 1.2       # Gripper clamping onto sock
    lift_duration_s: 1.5        # Elevating arm off floor
    basket_duration_s: 3.2      # Swing arm over chassis basket
    release_duration_s: 0.8     # Opening gripper over basket
    stow_duration_s: 2.5        # Parking arm into travel stow pose
